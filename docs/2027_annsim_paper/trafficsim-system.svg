<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 580 330" class="w-full h-auto" style="font-family: sans-serif;" xmlns="http://www.w3.org/2000/svg">

  <rect x="0" y="0" width="580" height="330" fill="#ffffff"/>

  <!-- OUTER SYSTEM BORDER -->
  <rect x="8" y="8" width="564" height="316" rx="8" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="14" y="2" width="119" height="16" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/>
  <text x="19" y="14" font-size="9.5" font-weight="700" font-family="sans-serif" fill="#111111">TrafficSim System</text>

  <!-- SECTION 1: EXTERNAL INPUTS (3 boxes side by side) -->

  <rect x="18" y="24" width="168" height="48" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="28" y1="41" x2="176" y2="41" stroke="#cccccc" stroke-width="0.8"/>
  <text x="102" y="37" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#111111">PeMS Data</text>
  <text x="28" y="53" font-size="8" font-family="sans-serif" fill="#444444">Mainline &#xB7; Ramp sensors</text>
  <text x="28" y="64" font-size="8" font-family="sans-serif" fill="#444444">15-min intervals (CSV)</text>

  <rect x="198" y="24" width="168" height="48" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="208" y1="41" x2="356" y2="41" stroke="#cccccc" stroke-width="0.8"/>
  <text x="282" y="37" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#111111">NetworkConfig</text>
  <text x="208" y="53" font-size="8" font-family="sans-serif" fill="#444444">Segments &#xB7; Lanes &#xB7; GPS</text>
  <text x="208" y="64" font-size="8" font-family="sans-serif" fill="#444444">Sensors &#xB7; Ramp topology</text>

  <rect x="378" y="24" width="170" height="48" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="388" y1="41" x2="538" y2="41" stroke="#cccccc" stroke-width="0.8"/>
  <text x="463" y="37" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#111111">DynamicsConfig</text>
  <text x="388" y="53" font-size="8" font-family="sans-serif" fill="#444444">IDM | Gipps | Krauss</text>
  <text x="388" y="64" font-size="8" font-family="sans-serif" fill="#444444">CF parameters &#xB7; vmax</text>

  <!-- SECTION 2: TRAFFIC MODEL BUILDER -->
  <rect x="18" y="80" width="544" height="36" rx="5" fill="#FFF7F7" stroke="#BA0C2F" stroke-width="2"/>
  <line x1="28" y1="97" x2="552" y2="97" stroke="#BA0C2F" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="290" y="94" text-anchor="middle" font-size="10" font-weight="700" font-family="sans-serif" fill="#BA0C2F">TrafficModelBuilder</text>
  <text x="28" y="110" font-size="8" font-family="sans-serif" fill="#444444">VSources &#xB7; Ramps &#xB7; Route &#xB7; Junctions &#xB7; Animation coords</text>

  <!-- SECTION 3: SCALATION PROCESS ENGINE -->
  <rect x="18" y="122" width="544" height="156" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="28" y1="139" x2="552" y2="139" stroke="#cccccc" stroke-width="0.8"/>
  <text x="290" y="135" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#111111">ScalaTion Process Engine</text>

  <!-- Left sub-panel: Arrival and Network -->
  <rect x="28" y="144" width="262" height="96" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <rect x="28" y="144" width="4" height="96" fill="#1a1a1a"/>
  <text x="43" y="158" font-size="9" font-weight="600" font-family="sans-serif" fill="#111111">Arrival &amp; Network</text>
  <line x1="32" y1="162" x2="286" y2="162" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="43" y="176" font-size="8.5" font-family="sans-serif" fill="#333333">Multi-VSource (&#xD7;4 lanes + ramps)</text>
  <text x="43" y="189" font-size="8.5" font-family="sans-serif" fill="#333333">Poisson | Erlang2S (per-lane &#x3BC;)</text>
  <text x="43" y="202" font-size="8.5" font-family="sans-serif" fill="#333333">Route &#x2192; Pathway (&#xD7;N lanes)</text>
  <text x="43" y="215" font-size="8.5" font-family="sans-serif" fill="#333333">Junction sensors &#xB7; Ramps &#xB7; Sink</text>

  <!-- Right sub-panel: Vehicle Physics -->
  <rect x="302" y="144" width="250" height="96" rx="4" fill="#FFF7F7" stroke="#BA0C2F" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="302" y="144" width="4" height="96" fill="#BA0C2F"/>
  <text x="316" y="158" font-size="9" font-weight="600" font-family="sans-serif" fill="#111111">Vehicle Physics</text>
  <line x1="306" y1="162" x2="548" y2="162" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="316" y="176" font-size="8" font-family="sans-serif" fill="#888888" font-style="italic">Car-Following Models</text>
  <text x="316" y="189" font-size="8.5" font-family="sans-serif" fill="#333333">IDM &#xB7; Gipps &#xB7; Krauss</text>
  <line x1="306" y1="197" x2="548" y2="197" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="316" y="210" font-size="8" font-family="sans-serif" fill="#888888" font-style="italic">Numerical Integrators</text>
  <text x="316" y="223" font-size="8.5" font-family="sans-serif" fill="#333333">Ballistic &#xB7; Euler &#xB7; Heun &#xB7; RK2&#x2013;RK4</text>
  <text x="316" y="235" font-size="8.5" font-family="sans-serif" fill="#333333">Butcher &#xB7; DOPRI5</text>

  <!-- Model Director / Scheduler strip -->
  <rect x="28" y="246" width="526" height="22" rx="3" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
  <rect x="28" y="246" width="4" height="22" fill="#1a1a1a"/>
  <text x="290" y="261" text-anchor="middle" font-size="9" font-weight="600" font-family="sans-serif" fill="#111111">Model Director / Scheduler  &#xB7;  Discrete + Continuous Time</text>

  <!-- SECTION 4: SIMULATION REPORT -->
  <rect x="18" y="282" width="544" height="38" rx="5" fill="#FFF7F7" stroke="#BA0C2F" stroke-width="2"/>
  <line x1="28" y1="299" x2="552" y2="299" stroke="#cccccc" stroke-width="0.8"/>
  <text x="290" y="296" text-anchor="middle" font-size="10" font-weight="700" font-family="sans-serif" fill="#BA0C2F">SimulationReport</text>
  <text x="28" y="314" font-size="8" font-family="sans-serif" fill="#444444">NRMSE &#xB7; RMSE &#xB7; sMAPE  vs  Observed PeMS (lane-level &#xB7; aggregate)</text>

</svg>
